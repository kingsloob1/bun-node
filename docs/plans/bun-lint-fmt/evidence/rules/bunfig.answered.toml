# The answered config (user, 2026-10-17): evidence/rules/bunfig.native-regexp.toml with Q2-Q6, Q8 and Q11 applied.
[lint]
typeAware = true   # Q11: the type-aware rules run in the gate, the editor and every bun lint
plugins = [{ name = "regexp", specifier = "eslint-plugin-regexp" }]
ignorePatterns = [
  "**/dist/**",
  "**/dts/**",
  "docs/**",
  "benchmarks/**",
  "**/bench/**/results/**",
]
reportUnusedDisableDirectives = "warn"

[lint.rules]
"@typescript-eslint/ban-ts-comment" = [
  "error",
  { ts-expect-error = "allow-with-description" },
]
"@typescript-eslint/ban-types" = "off"
"@typescript-eslint/consistent-type-definitions" = ["error", "interface"]
"@typescript-eslint/consistent-type-imports" = [
  "error",
  { disallowTypeAnnotations = false, fixStyle = "separate-type-imports", prefer = "type-imports" },
]
"@typescript-eslint/explicit-function-return-type" = "off"
"@typescript-eslint/explicit-module-boundary-types" = "off"
"@typescript-eslint/method-signature-style" = ["error", "property"]
"@typescript-eslint/no-array-constructor" = "error"
"@typescript-eslint/no-dupe-class-members" = "error"
"@typescript-eslint/no-duplicate-enum-values" = "error"
"@typescript-eslint/no-dynamic-delete" = "off"
"@typescript-eslint/no-empty-object-type" = [
  "error",
