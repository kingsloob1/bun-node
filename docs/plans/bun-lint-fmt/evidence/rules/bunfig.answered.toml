"arrow-body-style" = "off"
"block-scoped-var" = "error"
"bun/format" = "off" # Q6: bun fmt --check is its own step
"constructor-super" = "off"
"curly" = "off"
"default-case-last" = "error"
"dot-notation" = ["error", { allowKeywords = true, allowPattern = "" }]
