[[lint.overrides]]
files = [
  "**/__tests__/**",
  "**/*.spec.*",
  "**/*.test.*",
  "**/*.bench.*",
  "**/*.benchmark.*",
]
rules = { "bun:test/consistent-test-it" = "off", "bun:test/no-focused-tests" = "error", "bun:test/no-identical-title" = "error", "bun:test/prefer-hooks-in-order" = "off", "bun:test/prefer-lowercase-title" = "off", "n/no-top-level-await" = "off", "vitest/no-import-node-test" = "error", "no-restricted-globals" = ["error", { message = "Use `globalThis` instead.", name = "global" }, { message = "Use `globalThis` instead.", name = "self" }, { message = "Import it: `import { Buffer } from \"node:buffer\"`.", name = "Buffer" }] } # Q4; antfu turns node/prefer-global/process off in tests

[[lint.overrides]]
files = ["packages/bun-jobs-ui/**", "examples/bun-jobs-ui/**"]
rules = { "react/error-boundaries" = "error", "react/exhaustive-deps" = "warn", "react/iframe-missing-sandbox" = "warn", "react/jsx-key" = "error", "react/jsx-no-comment-textnodes" = "warn", "react/jsx-no-script-url" = "warn", "react/no-access-state-in-setstate" = "error", "react/no-array-index-key" = "warn", "react/no-children-prop" = "warn", "react/no-clone-element" = "warn", "react/no-danger" = "warn", "react/no-danger-with-children" = "error", "react/no-did-mount-set-state" = "warn", "react/no-did-update-set-state" = "warn", "react/no-direct-mutation-state" = "error", "react/no-find-dom-node" = "error", "react/no-namespace" = "error", "react/no-render-return-value" = "error", "react/no-unsafe" = "warn", "react/no-unstable-nested-components" = "error", "react/no-unused-class-component-methods" = "warn", "react/no-will-update-set-state" = "warn", "react/only-export-components" = ["error", { allowConstantExport = false, allowExportNames = [] }], "react/purity" = "warn", "react/rules-of-hooks" = "error", "react/set-state-in-effect" = "warn", "react/set-state-in-render" = "error", "react/static-components" = "error", "react/unsupported-syntax" = "error", "react/use-memo" = "error", "react/void-dom-elements-no-children" = "error" }

# antfu's per-glob disables (antfu/disables/scripts, cli, dts, cjs, config-files), kept as they are today.
[[lint.overrides]]
files = ["**/scripts/**", "**/cli/**", "**/cli.*", "**/*.config.*"]
rules = { "n/no-top-level-await" = "off" }
[[lint.overrides]]
files = ["**/*.d.ts", "**/*.d.mts", "**/*.d.cts"]
rules = { "@typescript-eslint/no-unused-vars" = "off", "unicorn/no-abusive-eslint-disable" = "off" }
[[lint.overrides]]
files = ["**/*.js", "**/*.cjs"]
rules = { "@typescript-eslint/no-require-imports" = "off" }

# CLI entry points: printing is the product, and top-level await blocks no importer.
[[lint.overrides]]
files = ["scripts/**", "playground/**", "examples/**", "templates/*/scripts/**"]
rules = { "no-console" = "off", "n/no-top-level-await" = "off" }

# Q5: Bun's default bug rules stay on, except bun:test/no-export in the shared test helpers.
[[lint.overrides]]
files = ["**/__tests__/helpers/**"]
rules = { "bun:test/no-export" = "off" }

[fmt]
singleAttributePerLine = true # the one option we set that is not Prettier's default
ignorePatterns = ["**/*.md", "docs/**", "benchmarks/results/**"] # Q3: Markdown is not formatted; Q2: no sortImports
